<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Five Separate Counters</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    .container {
      background: white;
      padding: 24px;
      border-radius: 18px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
      text-align: center;
      width: 100%;
      max-width: 600px;
    }

    h1 {
      margin: 0 0 24px;
      color: #222;
      font-size: clamp(1.6rem, 6vw, 2.2rem);
      line-height: 1.15;
    }

    .counters {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
    }

    button {
      width: 100%;
      min-height: 64px;
      padding: 18px;
      border: none;
      border-radius: 14px;
      background: #2563eb;
      color: white;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.15s, background 0.15s;
    }

    button:hover {
      background: #1d4ed8;
      transform: translateY(-2px);
    }

    button:active {
      transform: scale(0.98);
    }

    button span {
      display: inline-block;
      min-width: 24px;
    }

    @media (min-width: 520px) {
      .container {
        padding: 32px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Five Separate Counters</h1>

    <div class="counters">
      <button onclick="incrementCounter(0)">fear 1: <span>0</span></button>
      <button onclick="incrementCounter(1)">anger 2: <span>0</span></button>
      <button onclick="incrementCounter(2)">aversion 3: <span>0</span></button>
      <button onclick="incrementCounter(3)">loss 4: <span>0</span></button>
      <button onclick="incrementCounter(4)">pleasure 5: <span>0</span></button>
    </div>
  </div>

  <script>
    const counts = [0, 0, 0, 0, 0];
    const counterDisplays = document.querySelectorAll("button span");

    function incrementCounter(index) {
      counts[index]++;
      counterDisplays[index].textContent = counts[index];
    }
  </script>
</body>
</html>
