<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Five Separate Counters</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    .container {
      background: #111;
      padding: 24px;
      border-radius: 18px;
      box-shadow: 0 8px 24px rgba(255, 255, 255, 0.08);
      text-align: center;
      width: 100%;
      max-width: 600px;
      border: 1px solid #222;
    }

    h1 {
      margin: 0 0 24px;
      color: #fff;
      font-size: clamp(1.6rem, 6vw, 2.2rem);
      line-height: 1.15;
    }

    .counters {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
    }

    button {
      width: 100%;
      min-height: 64px;
      padding: 18px;
      border: none;
      border-radius: 14px;
      color: white;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.15s, filter 0.15s;
    }

    button:hover {
      filter: brightness(1.1);
      transform: translateY(-2px);
    }

    button:active {
      transform: scale(0.98);
    }

    button span {
      display: inline-block;
      min-width: 24px;
    }

    .counter-1 {
      background: #ef4444;
    }

    .counter-2 {
      background: #f97316;
    }

    .counter-3 {
      background: #22c55e;
    }

    .counter-4 {
      background: #3b82f6;
    }

    .counter-5 {
      background: #a855f7;
    }

    .reset-button {
      margin-top: 18px;
      background: #374151;
    }

    @media (min-width: 520px) {
      .container {
        padding: 32px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Five Separate Counters</h1>

    <div class="counters">
      <button class="counter-1" onclick="incrementCounter(0)">Counter 1: <span>0</span></button>
      <button class="counter-2" onclick="incrementCounter(1)">Counter 2: <span>0</span></button>
      <button class="counter-3" onclick="incrementCounter(2)">Counter 3: <span>0</span></button>
      <button class="counter-4" onclick="incrementCounter(3)">Counter 4: <span>0</span></button>
      <button class="counter-5" onclick="incrementCounter(4)">Counter 5: <span>0</span></button>
    </div>

    <button class="reset-button" onclick="resetCounters()">Reset All Counters</button>
  </div>

  <script>
    const STORAGE_KEY = "fiveSeparateCounters";
    const savedCounts = JSON.parse(localStorage.getItem(STORAGE_KEY));
    const counts = Array.isArray(savedCounts) ? savedCounts : [0, 0, 0, 0, 0];
    const counterDisplays = document.querySelectorAll(".counters button span");

    function saveCounters() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(counts));
    }

    function updateDisplay() {
      counterDisplays.forEach((display, index) => {
        display.textContent = counts[index];
      });
    }

    function incrementCounter(index) {
      counts[index]++;
      updateDisplay();
      saveCounters();
    }

    function resetCounters() {
      counts.fill(0);
      updateDisplay();
      saveCounters();
    }

    updateDisplay();
  </script>
</body>
</html>
